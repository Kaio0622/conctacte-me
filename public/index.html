<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f1eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Encontre profissionais verificados perto de você. Marketplace de serviços locais com avaliações reais e chat direto." />
  <title>Contact Me — profissionais verificados perto de você</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet" />
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181d'/%3E%3Cpath d='M9 20.5c0-3 2.5-5 5.5-5h3M22 11.5c0 3-2.5 5-5.5 5h-3' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
</head>
<body>

  <!-- ══ Topo ══════════════════════════════════════════════ -->
  <header class="topo">
    <div class="topo-interno">
      <button class="marca" data-ir="busca" aria-label="Contact Me — início">
        <span class="marca-selo">C</span>
        <span>Contact<span class="marca-fraca">Me</span></span>
      </button>

      <nav class="topo-nav" id="navTopo" aria-label="Navegação principal">
        <button data-ir="busca">Buscar</button>
        <button data-ir="solicitacoes">Solicitações</button>
        <button data-ir="conta">Minha conta</button>
      </nav>

      <div class="topo-fim" id="topoFim"></div>
    </div>
  </header>
  <div class="tema-barra">
    <label class="tema-rotulo" for="temaSeletor">Aparência</label>
    <div class="tema-controle">
      <span class="tema-icone" aria-hidden="true">
        <svg class="tema-icone-sistema" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
        <svg class="tema-icone-claro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        <svg class="tema-icone-escuro" viewBox="0 0 24 24"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
      </span>
      <select class="selecao tema-selecao" id="temaSeletor" data-tema-seletor>
        <option value="sistema">Padrão do dispositivo</option>
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
      </select>
      <svg class="tema-seta" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
    </div>
  </div>

  <!-- ══ Conteúdo ══════════════════════════════════════════ -->
  <main id="tela" role="main"></main>

  <!-- ══ Abas inferiores (mobile) ══════════════════════════ -->
  <nav class="abas" id="abas" aria-label="Navegação">
    <button data-ir="busca" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      Buscar
    </button>
    <button data-ir="solicitacoes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20.5l1.5-5.2A8.4 8.4 0 0 1 3.6 11.5a8.4 8.4 0 0 1 8.4-8.4 8.4 8.4 0 0 1 9 8.4Z" />
      </svg>
      Solicitações
      <span class="selo-contagem oculto" id="badgeChat">0</span>
    </button>
    <button data-ir="conta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
      </svg>
      Conta
    </button>
  </nav>

  <div class="avisos" id="avisos" aria-live="polite"></div>
  <div id="modais"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/icones.js"></script>
  <script src="/js/telas.js"></script>
  <script src="/js/chat-fotos.js"></script>
  <script src="/js/google.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
